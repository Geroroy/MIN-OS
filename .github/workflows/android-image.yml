# MIN OS ARM64(Android/Termux) 이미지를 GitHub 의 ARM64 러너에서 네이티브로 빌드하고,
# QEMU 부팅 테스트를 통과한 경우에만 Release "android-latest" 에 게시한다.
# 휴대폰에서는 android/setup.sh 가 이 Release 를 내려받는다.
name: Android ARM64 image

on:
  workflow_dispatch:
  push:
    branches: [ccr-0dc4d66d-j60c3m]
    paths:
      - "image/**"
      - "session/**"
      - "shell/**"
      - "libs/**"
      - "android/**"
      - "CMakeLists.txt"
      - "tests/image/**"
      - "tests/shell/check_screenshot.py"
      - ".github/workflows/android-image.yml"

permissions:
  contents: write

concurrency:
  group: android-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mmdebstrap ubuntu-keyring rsync mtools dosfstools e2fsprogs fdisk qemu-utils zstd \
            qemu-system-arm qemu-efi-aarch64 python3-pexpect python3-pil socat

      - name: Build ARM64 bundle (native arm64 chroot)
        run: sudo image/build.sh --suite ubuntu-noble --arch arm64 --format disk --profile mobile --output out/minos-arm64

      - name: Boot test (QEMU TCG — boot, session, MIN Shell, terminal, reboot, poweroff)
        run: sudo python3 -I tests/image/boot_test.py out/minos-arm64 --out out/boot-test-arm64 --timeout 2400

      - name: Package
        run: |
          sudo chown -R "$USER" out
          tar -C out --zstd -cf out/minos-android-arm64.tar.zst minos-arm64
          (cd out && sha256sum minos-android-arm64.tar.zst > minos-android-arm64.tar.zst.sha256)
          ls -la out

      - name: Upload boot test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-arm64
          path: out/boot-test-arm64
          if-no-files-found: ignore

      - name: Publish release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          MIN OS ARM64 개발 이미지 (Android/Termux QEMU 용). 커밋 ${GITHUB_SHA::7} 에서 자동 빌드되었고,
          GitHub ARM64 러너의 QEMU(TCG)에서 부팅·세션·MIN Shell·터미널·재부팅·종료 테스트를 통과했습니다.

          휴대폰(Termux)에서 설치·실행:
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/android/setup.sh | bash
          \`\`\`
          자세한 내용: docs/ANDROID_EMULATION.md

          개발 이미지 계정: min / min (sudo), root / minos. VNC 는 127.0.0.1 에만 열립니다.
          실기기(Galaxy S25 Ultra) 검증은 아직 수행되지 않았습니다.
          NOTES
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest --target "$GITHUB_SHA" --prerelease \
            --title "MIN OS ARM64 (Android) — dev build ${GITHUB_SHA::7}" --notes-file notes.md \
            out/minos-android-arm64.tar.zst out/minos-android-arm64.tar.zst.sha256 \
            out/boot-test-arm64/03-terminal.png
