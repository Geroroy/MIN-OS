# MIN OS @VERSION@ (@SUITE@, @ARCH@) — 디스크 이미지 UEFI 부팅용 GRUB 메뉴 (루트 파티션 /boot/grub/grub.cfg)
set timeout=3
set default=0
insmod all_video
# x86: 시리얼 포트가 있으면 메뉴를 시리얼에도 출력. ARM64 virt 의 PL011 은 GRUB 의 com0 가 아니므로 건너뛴다.
if [ "$grub_cpu" = "x86_64" -o "$grub_cpu" = "i386" ]; then
  if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
  fi
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray
search --no-floppy --set=root --label minos-root

menuentry "MIN OS @VERSION@" --hotkey=m {
  linux /boot/vmlinuz root=LABEL=minos-root rw rootwait quiet loglevel=3 systemd.show_status=0 @RENDER@ @CONSOLE@
  initrd /boot/initrd.img
}
menuentry "MIN OS (software rendering)" --hotkey=w {
  linux /boot/vmlinuz root=LABEL=minos-root rw rootwait quiet loglevel=3 systemd.show_status=0 minos.render=software @CONSOLE@
  initrd /boot/initrd.img
}
menuentry "MIN OS (verbose, software rendering)" --hotkey=s {
  linux /boot/vmlinuz root=LABEL=minos-root rw rootwait loglevel=4 minos.render=software @CONSOLE@
  initrd /boot/initrd.img
}
menuentry "Reboot" --hotkey=r { reboot }
menuentry "Power off" --hotkey=p { halt }
