# HAGRA(하그라) @VERSION@ (@SUITE@) — GRUB 메뉴 (BIOS/UEFI 공용). 색은 무채색, 강조는 흑백 반전.
set timeout=5
set default=0
insmod all_video
insmod gfxterm
insmod font
# 시리얼 포트가 있으면 메뉴를 시리얼에도 출력/입력 (헤드리스 QEMU 테스트)
if serial --unit=0 --speed=115200; then
  terminal_input --append serial
  terminal_output --append serial
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

menuentry "HAGRA @VERSION@ (development image)" --hotkey=m {
  linux /live/vmlinuz boot=live quiet loglevel=3 systemd.show_status=0
  initrd /live/initrd.img
}
menuentry "HAGRA (software rendering)" --hotkey=w {
  linux /live/vmlinuz boot=live quiet loglevel=3 systemd.show_status=0 hagra.render=software
  initrd /live/initrd.img
}
menuentry "HAGRA (serial console debug: ttyS0)" --hotkey=s {
  linux /live/vmlinuz boot=live console=tty0 console=ttyS0,115200n8 loglevel=4 hagra.render=software
  initrd /live/initrd.img
}
menuentry "Reboot" --hotkey=r { reboot }
menuentry "Power off" --hotkey=p { halt }
