# MIN OS 공식 대상: Debian 13 "trixie" (stable)
SUITE_NAME=trixie
MIRROR=http://deb.debian.org/debian
MIRROR_arm64=http://deb.debian.org/debian
COMPONENTS="main contrib non-free-firmware"
KEYRING=/usr/share/keyrings/debian-archive-keyring.gpg
# 커널 및 펌웨어 (아키텍처별)
KERNEL_PKGS_amd64="linux-image-amd64 firmware-linux-free"
KERNEL_PKGS_arm64="linux-image-arm64"
# 배포판 특화 추가 패키지
EXTRA_PKGS=""
