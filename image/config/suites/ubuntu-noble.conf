# 파이프라인 검증용 대안 대상: Ubuntu 24.04 "noble" (Debian 미러가 차단된 환경)
SUITE_NAME=noble
MIRROR=http://archive.ubuntu.com/ubuntu
COMPONENTS="main universe"
KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg
# linux-image-virtual: 펌웨어(linux-firmware ≈ 600MB) 없이 QEMU에 필요한 모듈만. GPU 모듈은 hook이 보충한다.
KERNEL_PKGS="linux-image-virtual"
EXTRA_PKGS=""
